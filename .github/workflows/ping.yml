name: Usage window ping

on:
  # Sends one tiny Haiku message per Claude account (see the matrix below)
  # about once an hour, at :45 UTC, so each account's 5-hour usage window
  # reopens as soon as the last one ends. A ping inside an open window is
  # a harmless no-op.
  #
  # Phase control: DC Record runs at 14:00 and 22:45 UTC (7:00am / 3:45pm
  # PDT). A window resets 5h after the ping that opened it, so to have
  # resets land exactly 1h after each run starts, a window must open at
  # 10:00 UTC (resets 15:00) and at 18:45 UTC (resets 23:45). That means
  # no window may be opened inside QUIET hours, or it would still be
  # running at the next anchor and shift everything after it:
  #
  #   quiet 05:00-10:00 UTC (10:00 anchor): a window opened here ends
  #                          after 10:00
  #   quiet 13:45-18:45 UTC (18:45 anchor): the idle gap after the 15:00
  #                          reset until the PM window opens (3h45m, the
  #                          unavoidable cost: the runs are 8h45m apart)
  #
  # Ping times: every :45 plus an extra 10:00 anchor. Pings in quiet hours
  # are skipped. Revisit at the Nov 1 DST change along with the
  # dc-record-scheduler crons (PST: runs 15:00 / 23:45 UTC, so anchors
  # 11:00 / 19:45, quiet 06:00-11:00 / 14:45-19:45).
  #
  # GitHub silently drops most scheduled runs on quiet repos (an hourly
  # cron fired only every 4-10 hours), so the schedule is just a fallback.
  # The real clock is a self-chaining loop: every run ends by dispatching
  # the next one (workflow_dispatch is the one event GITHUB_TOKEN may
  # trigger), and that chained run first sleeps on a runner until the next
  # ping time. If the chain ever breaks, the next scheduled run that
  # GitHub does fire restarts it. Off :00 because that's when GitHub drops
  # most.
  #
  # Public repo, so Actions minutes are free (sleeping included) and don't
  # touch dc-record's 2,000-minute allowance.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: Sleep until the next ping time first (set by the loop itself)
        type: boolean
        default: false
      force:
        description: Ping now, ignoring quiet hours and the 50-minute guard
        type: boolean
        default: false

# At most one run in progress and one pending; a newer pending run
# replaces the older one, so the chain and the fallback can't pile up.
concurrency:
  group: window-ping
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  wait:
    if: inputs.chained
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Sleep until the next ping time (:45, or the 10:00 UTC anchor)
        run: |
          now=$(date +%s)
          wake=$(( now / 3600 * 3600 + 2700 ))
          [ "$wake" -le $((now + 5)) ] && wake=$((wake + 3600))
          anchor=$(date -u -d "today 10:00" +%s)
          [ "$anchor" -le $((now + 5)) ] && anchor=$((anchor + 86400))
          [ "$anchor" -lt "$wake" ] && wake=$anchor
          echo "sleeping $(( (wake - now) / 60 )) min until $(date -u -d @$wake +%FT%TZ)"
          sleep $((wake - now))

  ping:
    needs: wait
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    # One leg per Claude account: personal = CLAUDE_CODE_OAUTH_TOKEN,
    # work = CLAUDE_CODE_OAUTH_TOKEN_WORK (skipped if that secret is unset).
    strategy:
      fail-fast: false
      matrix:
        account: [personal, work]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each successful ping uploads a last-ping-<account> artifact; its
      # creation time is the "last pinged" timestamp. Stops a fallback run
      # from pinging right after a chained one did.
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_WORK_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_WORK != '' }}
        run: |
          if [ "${{ matrix.account }}" = work ] && [ "$HAS_WORK_TOKEN" != true ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN_WORK not set, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.force }}" != true ]; then
            # Quiet hours (UTC minutes of day): see the header comment.
            m=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            if { [ "$m" -gt 300 ] && [ "$m" -lt 600 ]; } || { [ "$m" -gt 825 ] && [ "$m" -lt 1125 ]; }; then
              echo "quiet hours ($(date -u +%H:%M) UTC), skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            last=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=last-ping-${{ matrix.account }}&per_page=1" \
              --jq '.artifacts[0].created_at // empty')
            if [ -n "$last" ]; then
              age=$(( $(date +%s) - $(date -d "$last" +%s) ))
              if [ "$age" -lt $((50*60)) ]; then
                echo "last ping $((age/60)) min ago, skipping"
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "last ping $((age/60)) min ago"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.skip == 'false'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ping
        if: steps.gate.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.account == 'work' && secrets.CLAUDE_CODE_OAUTH_TOKEN_WORK || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if ! echo "Reply with just: ok" | \
            claude -p \
              --model haiku \
              --max-turns 1 \
              --output-format json > ping_result.json; then
            echo "claude exited non-zero, output was:"
            cat ping_result.json
            exit 1
          fi
          jq -r '"result=" + (.result|tostring) + "  cost_usd=" + (.total_cost_usd|tostring)' ping_result.json
          date -u +%FT%TZ > last_ping.txt

      - name: Record ping
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: last-ping-${{ matrix.account }}
          path: last_ping.txt
          retention-days: 1

      # GitHub disables scheduled workflows in a public repo after 60 days
      # with no commits. Push an empty commit whenever the newest one is
      # over 30 days old, so the fallback schedule never lapses.
      - name: Keepalive
        if: always() && matrix.account == 'personal'
        uses: actions/checkout@v7
      - name: Keepalive commit
        if: always() && matrix.account == 'personal'
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((30*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          else
            echo "newest commit is $((age/86400)) days old, no keepalive needed"
          fi

  # Runs even if a ping failed, so one bad token never breaks the loop.
  next:
    needs: ping
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ping.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chained=true
