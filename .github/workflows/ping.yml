name: Usage window ping

on:
  # Hourly. Off the top of the hour because GitHub delays or drops
  # scheduled runs most often at :00, when load is heaviest.
  # Each run sends one tiny Haiku message on CLAUDE_CODE_OAUTH_TOKEN so a
  # 5-hour Claude usage window is always open. If one is already open,
  # the message is a harmless no-op.
  # Public repo, so Actions minutes are free and don't touch dc-record's
  # 2,000-minute allowance.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: window-ping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ping
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Reply with just: ok" | \
            claude -p \
              --model claude-haiku-4-5-20251001 \
              --max-turns 1 \
              --output-format json > ping_result.json
          jq -r '"result=" + (.result|tostring) + "  cost_usd=" + (.total_cost_usd|tostring)' ping_result.json

      # GitHub disables scheduled workflows in a public repo after 60 days
      # with no commits. Push an empty commit whenever the newest one is
      # over 30 days old, so the schedule never lapses.
      - name: Keepalive
        if: always()
        uses: actions/checkout@v4
      - name: Keepalive commit
        if: always()
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((30*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          else
            echo "newest commit is $((age/86400)) days old, no keepalive needed"
          fi
