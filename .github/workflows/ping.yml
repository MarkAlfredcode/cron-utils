name: Usage window ping

on:
  # Sends one tiny Haiku message per Claude account (see the matrix below)
  # about once an hour, so each account's 5-hour usage window is always
  # open. If one is already open, the message is a harmless no-op.
  #
  # GitHub silently drops most scheduled runs on quiet repos (an hourly
  # cron fired only every 4-10 hours), so the schedule is just a fallback.
  # The real clock is a self-chaining loop: every run ends by dispatching
  # the next one (workflow_dispatch is the one event GITHUB_TOKEN may
  # trigger), and that chained run first waits on the "hourly"
  # environment, whose 55-minute wait timer holds it without using a
  # runner. If the chain ever breaks, the next scheduled run that GitHub
  # does fire restarts it. Off :00 because that's when GitHub drops most.
  #
  # Public repo, so Actions minutes are free and don't touch dc-record's
  # 2,000-minute allowance.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: Wait for the hourly timer first (set by the loop itself)
        type: boolean
        default: false
      force:
        description: Ping even if one went out in the last 50 minutes
        type: boolean
        default: false

# At most one run in progress and one pending; a newer pending run
# replaces the older one, so the chain and the fallback can't pile up.
concurrency:
  group: window-ping
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  wait:
    if: inputs.chained
    environment: hourly
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "hourly timer elapsed"

  ping:
    needs: wait
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    # One leg per Claude account: personal = CLAUDE_CODE_OAUTH_TOKEN,
    # work = CLAUDE_CODE_OAUTH_TOKEN_WORK (skipped if that secret is unset).
    strategy:
      fail-fast: false
      matrix:
        account: [personal, work]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each successful ping uploads a last-ping-<account> artifact; its
      # creation time is the "last pinged" timestamp. Stops a fallback run
      # from pinging right after a chained one did.
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_WORK_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_WORK != '' }}
        run: |
          if [ "${{ matrix.account }}" = work ] && [ "$HAS_WORK_TOKEN" != true ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN_WORK not set, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.force }}" != true ]; then
            last=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=last-ping-${{ matrix.account }}&per_page=1" \
              --jq '.artifacts[0].created_at // empty')
            if [ -n "$last" ]; then
              age=$(( $(date +%s) - $(date -d "$last" +%s) ))
              if [ "$age" -lt $((50*60)) ]; then
                echo "last ping $((age/60)) min ago, skipping"
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "last ping $((age/60)) min ago"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.skip == 'false'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ping
        if: steps.gate.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.account == 'work' && secrets.CLAUDE_CODE_OAUTH_TOKEN_WORK || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if ! echo "Reply with just: ok" | \
            claude -p \
              --model haiku \
              --max-turns 1 \
              --output-format json > ping_result.json; then
            echo "claude exited non-zero, output was:"
            cat ping_result.json
            exit 1
          fi
          jq -r '"result=" + (.result|tostring) + "  cost_usd=" + (.total_cost_usd|tostring)' ping_result.json
          date -u +%FT%TZ > last_ping.txt

      - name: Record ping
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: last-ping-${{ matrix.account }}
          path: last_ping.txt
          retention-days: 1

      # GitHub disables scheduled workflows in a public repo after 60 days
      # with no commits. Push an empty commit whenever the newest one is
      # over 30 days old, so the fallback schedule never lapses.
      - name: Keepalive
        if: always() && matrix.account == 'personal'
        uses: actions/checkout@v7
      - name: Keepalive commit
        if: always() && matrix.account == 'personal'
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((30*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          else
            echo "newest commit is $((age/86400)) days old, no keepalive needed"
          fi

  # Runs even if a ping failed, so one bad token never breaks the loop.
  next:
    needs: ping
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ping.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chained=true
